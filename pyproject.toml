[project]
name = "mcp-change-lens"
version = "0.1.0"
description = "MCP server that explains what changed between two Git commits in terms of behaviour"
requires-python = ">=3.10"
dependencies = ["mcp>=1.10,<2", "anthropic>=0.40"]

[project.scripts]
mcp-change-lens = "change_lens.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/change_lens"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
