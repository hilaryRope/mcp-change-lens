[project]
name = "mcp-change-lens"
version = "0.1.0"
description = "MCP server that reviews a change between two Git refs: behavioural impact, affected components, test coverage and gaps, docs, config and CI"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ilaria Corda" }]
requires-python = ">=3.10"
dependencies = ["mcp>=1.10,<2", "anthropic>=0.40"]

[project.scripts]
mcp-change-lens = "change_lens.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/change_lens"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
